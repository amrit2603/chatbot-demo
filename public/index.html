<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chatbot Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:700px; margin:2rem auto; }
    #messages { border:1px solid #ddd; padding:1rem; height:300px; overflow:auto; }
    .msg.user { text-align:right; color:#034; }
    .msg.bot { text-align:left; color:#222; }
  </style>
</head>
<body>
  <h1>Chatbot Demo</h1>
  <div id="messages"></div>
  <textarea id="input" rows="3" style="width:100%"></textarea>
  <button id="send">Send</button>
<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function addMessage(text, cls) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  send.onclick = async () => {
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, 'user');
    input.value = '';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      addMessage(data.reply || "(no reply)", 'bot');
    } catch (e) {
      addMessage("Error: " + e.message, 'bot');
    }
  };
</script>
</body>
</html>
